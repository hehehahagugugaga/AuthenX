<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthenX — Secure Document Authentication & Verification System</title>
  <meta name="description"
    content="AuthenX — Government-grade document authentication and verification platform powered by AI, cryptographic integrity, and blockchain technology. Verify documents, detect tampering, and ensure authenticity." />
  <meta name="keywords" content="document verification, authentication, blockchain, government, SIH, PS 188, AuthenX" />
  <meta name="author" content="AuthenX" />
  <meta name="theme-color" content="#0F1B2D" />

  <!-- Favicon (inline SVG) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />

  <!-- Google Fonts: Instrument Serif + Plus Jakarta Sans + Outfit + JetBrains Mono + Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/variables.css?v=31" />
  <link rel="stylesheet" href="styles/base.css?v=31" />
  <link rel="stylesheet" href="styles/layout.css?v=31" />
  <link rel="stylesheet" href="styles/components.css?v=31" />
  <link rel="stylesheet" href="styles/pages/home.css?v=31" />
  <link rel="stylesheet" href="styles/pages/dashboard.css?v=31" />
  <link rel="stylesheet" href="styles/pages/verify.css?v=31" />
  <link rel="stylesheet" href="styles/pages/history.css?v=31" />
  <link rel="stylesheet" href="styles/responsive.css?v=31" />
</head>

<body>
  <!-- Ambient Living Atmosphere (Dynamic Floating Glow Orbs & Subtle Cyber Grid) -->
  <div class="ambient-living-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
    <div class="ambient-grid-overlay"></div>
  </div>

  <div class="app-layout" style="position: relative; z-index: 1;">
    <!-- Topbar (Unified Header with Brand, Navigation & Controls) -->
    <header class="topbar" id="topbar" role="banner">
      <!-- Rendered by topbar.js -->
    </header>

    <!-- Collapsible Mobile Sidebar Drawer & Backdrop Overlay -->
    <aside class="mobile-sidebar" id="mobile-sidebar" aria-label="Mobile Navigation Drawer" aria-hidden="true">
      <!-- Rendered by sidebar.js -->
    </aside>
    <div class="mobile-sidebar-backdrop" id="mobile-sidebar-backdrop"></div>

    <!-- Main Content -->
    <main class="main-wrapper">
      <!-- Real-Time Institutional Telemetry & Living Network Stream -->
      <div id="live-telemetry-container" class="telemetry-wrapper"></div>

      <div class="main-content" id="main-content" role="main">
        <!-- Loading state -->
        <div class="page-header">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-text" style="width:50%;"></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-4);margin-bottom:var(--space-6);">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
        <div class="skeleton skeleton-chart" style="margin-bottom:var(--space-6);"></div>
      </div>
    </main>
  </div>

  <!-- App Script (Bundled for seamless operation on localhost, live-server, and file:// protocols) -->
  <script src="js/bundle.js?v=31"></script>

  <!-- Fallback Watchdog for immediate visual recovery -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      // If skeleton is still present after 1 second, ensure clean initialization
      setTimeout(function () {
        const skeleton = document.querySelector('.skeleton');
        if (skeleton && window.DocuVerify && !window.DocuVerify.initialized) {
          console.warn('DocuVerify watchdog triggered');
        }
      }, 1000);
    });
  </script>
</body>

</html>
